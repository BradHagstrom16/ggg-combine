name = "ggg-combine"
main = "worker/worker.js"
compatibility_date = "2026-08-13"

# Static site (/public) and the API (/log) are served from the SAME origin by this
# one Worker. That is deliberate: no GitHub Pages, no CORS, no preflights.
#
# run_worker_first pins the API paths to the Worker explicitly rather than relying
# on them simply failing to match an asset. Debugging "why is my API returning
# HTML" at 11pm mid-Gauntlet is not a thing that should be possible.
#
# The shared engine (src/) and the spec are a SIBLING of ./public, but the browser
# must import them as plain ES modules with no build step. Two committed symlinks
# bridge that gap: public/src -> ../src and public/combine-2026-spec.md. Wrangler's
# asset walker follows them, so /src/scoring.js and /combine-2026-spec.md serve with
# the right MIME type while src/ stays the single source of truth (verified: both
# 200 with text/javascript + text/markdown). Do NOT copy src/ into public/ — the
# symlinks keep one copy and honour the "no build step" rule.
[assets]
directory = "./public"
run_worker_first = ["/log", "/log/*"]
# Pin the extensionless-nav behavior explicitly. Every page links to /agenda, /events, /rules,
# /admin (no .html), and the worker 404s anything but /log, so these are served entirely by the
# asset router mapping /agenda -> agenda.html. That mapping is Cloudflare's DEFAULT, but leaving
# it implicit means a future default change (or html_handling = "none") would 404 all nav. Pin it.
html_handling = "auto-trailing-slash"

# The append-only entry log lives in ONE Durable Object instance (name: "log").
# Durable Objects are strongly consistent, so a write is visible to the next read.
[[durable_objects.bindings]]
name = "LOG"
class_name = "LogDO"

# Declarative export: LogDO is being created here for the first time, so it takes the
# `exports` form rather than a legacy `[[migrations]]` block (the two are mutually
# exclusive). `sqlite` storage is both what the append-only log wants and the
# free-tier-eligible backend — `legacy-kv` Durable Objects are paid-plan only.
[exports.LogDO]
type = "durable-object"
storage = "sqlite"

# ADMIN_PIN is a secret, NOT a var — set it with:
#   npx wrangler secret put ADMIN_PIN
# It must never appear in this file or anywhere else in git.

[vars]
# Which Durable Object instance holds the log. Changing this and redeploying gives a
# GUARANTEED-EMPTY log, leaving the old one intact and inspectable.
#
# Now LIVE for the real event: flipped from "rehearsal" to "live-2026" on 2026-08-17, after the
# dress rehearsal's full fake weekend, to hand the combine a clean, guaranteed-empty log. The
# rehearsal instance and all its data remain intact and inspectable under the name "rehearsal".
#
# Do NOT change it during the event. GET /log echoes the value back so a mistake is visible
# instead of silently serving an empty board.
LOG_INSTANCE = "live-2026"
